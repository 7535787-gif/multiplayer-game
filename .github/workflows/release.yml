name: Release container
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
  packages: write
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Trigger hosting deployment
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            curl --fail --show-error --silent -X POST "$DEPLOY_WEBHOOK_URL" -H 'Content-Type: application/json' -d "{\"image\":\"$IMAGE\",\"tag\":\"${GITHUB_REF_NAME}\"}"
          else
            echo 'DEPLOY_WEBHOOK_URL is not configured. Configure the hosting platform deploy hook before releasing.'
            exit 1
          fi
